name: AUR Release
on:
  push:
    tags:
      - 'v*'

jobs:
  aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag and package metadata match
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkgver="$(sed -n 's/^pkgver=//p' contrib/PKGBUILD)"
          srcinfo_ver="$(sed -n 's/^[[:space:]]*pkgver = //p' contrib/.SRCINFO | head -n1)"
          test "$version" = "$pkgver"
          test "$version" = "$srcinfo_ver"

      - name: Push to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.0.0
        with:
          pkgname: niri-screenshare
          pkgbuild: ./contrib/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: 176167047+pantarune@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
